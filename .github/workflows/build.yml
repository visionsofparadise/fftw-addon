name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: macos-latest
            platform: darwin
            arch: x64
            cmake-extra: "--CDCMAKE_OSX_ARCHITECTURES=x86_64"
          - os: macos-latest
            platform: darwin
            arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Build addon
        run: npx cmake-js compile --CDCMAKE_BUILD_TYPE=Release --CDCMAKE_POLICY_VERSION_MINIMUM=3.5 ${{ matrix.cmake-extra }}

      - name: Test addon
        if: matrix.cmake-extra == ''
        run: node test.js

      - name: Rename artifact
        shell: bash
        run: |
          mkdir -p artifacts
          cp build/Release/fftw_addon.node artifacts/fftw-${{ matrix.platform }}-${{ matrix.arch }}.node

      - uses: actions/upload-artifact@v4
        with:
          name: fftw-${{ matrix.platform }}-${{ matrix.arch }}
          path: artifacts/*.node

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.node
          generate_release_notes: true
