name: Build

on: workflow_dispatch

concurrency:
   group: release
   cancel-in-progress: false

jobs:
   gate:
      if: github.ref == 'refs/heads/main'
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v4
           with:
              fetch-depth: 0

         - name: Refuse a released version
           env:
              GH_TOKEN: ${{ github.token }}
           run: |
              tag="v$(node -p "require('./package.json').version")"
              if [ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null)" = false ]; then
                 echo "::error::$tag is already released; bump the version"
                 exit 1
              fi
              if git rev-parse -q --verify "refs/tags/$tag" >/dev/null && [ "$(git rev-parse "$tag^{commit}")" != "$GITHUB_SHA" ]; then
                 echo "::error::$tag already tags another commit; bump the version"
                 exit 1
              fi

         - uses: actions/setup-node@v4
           with:
              node-version: 22

         - name: Pin npm 12
           run: npm install -g npm@12

         - name: Enforce install-script allowlist
           run: npm config set strict-allow-scripts=true --location=project

         - run: npm install

         - run: npm run check

   detect-version:
      needs: gate
      runs-on: ubuntu-latest
      outputs:
         version: ${{ steps.check.outputs.version }}
      steps:
         - uses: actions/checkout@v4

         - id: check
           shell: bash
           run: |
              current=$(node -p "require('./package.json').version")
              echo "version=$current" >> "$GITHUB_OUTPUT"

   build:
      needs: gate
      strategy:
         fail-fast: false
         matrix:
            include:
               - os: windows-latest
                 platform: win32
                 arch: x64
               - os: ubuntu-latest
                 platform: linux
                 arch: x64
               - os: macos-latest
                 platform: darwin
                 arch: x64
                 cmake-extra: "--CDCMAKE_OSX_ARCHITECTURES=x86_64"
               - os: macos-latest
                 platform: darwin
                 arch: arm64

      runs-on: ${{ matrix.os }}

      steps:
         - uses: actions/checkout@v4

         - uses: actions/setup-node@v4
           with:
              node-version: 22

         - name: Pin npm 12
           run: npm install -g npm@12

         - name: Enforce install-script allowlist
           run: npm config set strict-allow-scripts=true --location=project

         - run: npm install

         - name: Build addon
           run: npx cmake-js compile --CDCMAKE_BUILD_TYPE=Release --CDCMAKE_POLICY_VERSION_MINIMUM=3.5 ${{ matrix.cmake-extra }}

         - name: Test addon
           if: matrix.cmake-extra == ''
           run: node test.js

         - name: Rename artifact
           shell: bash
           run: |
              mkdir -p artifacts
              cp build/Release/fftw_addon.node artifacts/fftw-${{ matrix.platform }}-${{ matrix.arch }}.node

         - uses: actions/upload-artifact@v4
           with:
              retention-days: 7
              name: fftw-${{ matrix.platform }}-${{ matrix.arch }}
              path: artifacts/*.node

   release:
      needs: [detect-version, build]
      runs-on: ubuntu-latest
      permissions:
         contents: write

      steps:
         - uses: actions/checkout@v4

         - uses: actions/download-artifact@v4
           with:
              path: artifacts
              merge-multiple: true

         - name: List artifacts
           run: ls -la artifacts/

         - name: Create and push tag
           env:
              VERSION: ${{ needs.detect-version.outputs.version }}
           run: |
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              if [ "$(git ls-remote --tags origin "refs/tags/v$VERSION")" = "" ]; then
                 git tag "v$VERSION"
                 git push origin "v$VERSION"
              fi

         - uses: softprops/action-gh-release@v2
           with:
              tag_name: v${{ needs.detect-version.outputs.version }}
              files: artifacts/*.node
              generate_release_notes: true

         - name: Delete older stable releases
           env:
              GH_TOKEN: ${{ github.token }}
           run: node scripts/releaseRetention.mjs releases v${{ needs.detect-version.outputs.version }}

   cleanup-artifacts:
      needs: [build, release]
      if: ${{ always() && needs.build.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
      runs-on: ubuntu-latest
      permissions:
         actions: write
      steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-node@v4
           with:
              node-version: 24
         - name: Delete temporary workflow artifacts
           env:
              GH_TOKEN: ${{ github.token }}
           run: node scripts/releaseRetention.mjs artifacts
