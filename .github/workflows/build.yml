name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: macos-13
            platform: darwin
            arch: x64
          - os: macos-latest
            platform: darwin
            arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Build addon
        run: npx cmake-js compile --CDCMAKE_BUILD_TYPE=Release

      - name: Rename artifact
        shell: bash
        run: |
          mkdir -p artifacts
          cp build/Release/fftw_addon.node artifacts/fftw-${{ matrix.platform }}-${{ matrix.arch }}.node

      - uses: actions/upload-artifact@v4
        with:
          name: fftw-${{ matrix.platform }}-${{ matrix.arch }}
          path: artifacts/*.node

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: all-prebuilts
          path: artifacts/*.node
